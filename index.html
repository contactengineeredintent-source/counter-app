<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conter Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="d-flex flex-column m-3 w-50">
      <h1 class="text-white">Counter Using HTML</h1>
      <p id="currentCounter" class="text-white fs-5">Your current count is : <span id="countValue"></span></p>
      <hr class="border border-white opacity-100 w-25">
      <p id="errorMessage"></p>
      <div id="btnSection">
        <button id="btnDecrease" class="btn btn-light">Decrement</button>
        <button id="btnIncrease" class="btn btn-light">Increment</button>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"
  ></script>
</html>
